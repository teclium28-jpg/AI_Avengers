<svg width="64" height="64" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fs-bg-grad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="fs-accent-grad" x1="10" y1="10" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="fs-subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded Squircle Canvas -->
  <rect width="36" height="36" rx="9" fill="url(#fs-bg-grad)" />

  <!-- Inset Border -->
  <rect x="0.75" y="0.75" width="34.5" height="34.5" rx="8.25" stroke="white" stroke-opacity="0.14" stroke-width="1.5" />

  <!-- The Monogram: Interlocking Equilibrium 'F' & 'S' -->
  <g filter="url(#fs-subtle-shadow)">
    <!-- Top Ceiling Tier (F top bar / Stock Ceiling) -->
    <path d="M10 11H26" stroke="white" stroke-width="3.2" stroke-linecap="round" />

    <!-- Continuous Sinuous Backbone connecting F & S -->
    <path d="M10 11V17.5C10 18.8807 11.1193 20 12.5 20H23.5C24.8807 20 26 21.1193 26 22.5V23C26 24.3807 24.8807 25.5 23.5 25.5H10" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Progressive Max-Min Mid-Level Fulcrum Crossbeam -->
    <path d="M10 17.5H20" stroke="url(#fs-accent-grad)" stroke-width="2.8" stroke-linecap="round" />

    <!-- Equilibrium Anchor Nodes -->
    <circle cx="23.5" cy="13.2" r="1.5" fill="#a7f3d0" />
    <circle cx="12.5" cy="23.5" r="1.5" fill="#a7f3d0" />
  </g>
</svg>
